<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library — FunLearn Island</title>
<link rel="stylesheet" href="assets/style.css">
<script src="assets/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<nav class="nav"><div class="nav-inner">
  <a class="logo" href="index.html">🏝️ FunLearn Island</a>
  <div class="nav-links">
    <a href="library.html" data-page="library" class="hide-sm">Library</a>
    <a href="index.html#pricing" class="hide-sm">Pricing</a>
    <span id="nav-auth"></span>
  </div>
</div></nav>

<section class="section wrap">
  <h2>📚 Library</h2>
  <p class="lede" id="library-lede">Free content is open to all — members unlock everything</p>
  <div class="grid grid-3" id="grid"><p style="color:var(--muted)">Loading…</p></div>
</section>

<footer>© 2026 FunLearn Island</footer>

<script src="assets/app.js"></script>
<script>
initNav("library");
(async () => {
  try {
    const [{ active }, items] = await Promise.all([getMembership(), fetchContent()]);
    const grid = document.getElementById("grid");
    if (!items.length) { grid.innerHTML = "<p>New resources are on the way — check back soon…</p>"; return; }
    grid.innerHTML = items.map(i => contentCard(i, !active)).join("");
    if (!active && items.some(i => i.tier === "member")) {
      document.getElementById("library-lede").innerHTML =
        '🔒 <a href="index.html#pricing" style="color:var(--purple);font-weight:700">Become a member</a> to unlock all members-only content';
    } else if (active) {
      document.getElementById("library-lede").textContent = "👑 Everything is unlocked — happy exploring!";
    }
  } catch (e) {
    document.getElementById("grid").innerHTML = "<p>Couldn't load. Please refresh and try again.</p>";
  }
})();
</script>
</body>
</html>
