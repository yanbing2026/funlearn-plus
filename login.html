<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — FunLearn Island</title>
<link rel="stylesheet" href="assets/style.css">
<script src="assets/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<nav class="nav"><div class="nav-inner">
  <a class="logo" href="index.html">🏝️ FunLearn Island</a>
  <div class="nav-links">
    <a href="library.html" data-page="library" class="hide-sm">Library</a>
    <a href="index.html#pricing" class="hide-sm">Pricing</a>
    <span id="nav-auth"></span>
  </div>
</div></nav>

<div class="wrap">
  <div class="card form-card">
    <div style="font-size:44px">📮</div>
    <h2 style="margin:10px 0 6px">Sign in / Sign up</h2>
    <p style="color:var(--muted);font-size:15px;margin:0">Enter your email and we'll send you a sign-in link.<br>No password needed.</p>
    <div id="form-box">
      <input class="field" id="email" type="email" placeholder="you@example.com" autocomplete="email">
      <button class="btn" id="send-btn" style="width:100%">Send sign-in link</button>
    </div>
    <div id="sent-box" class="hidden">
      <div class="notice">✅ Sign-in link sent!<br>Check the inbox of <b id="sent-email"></b> (including spam) and click the link to sign in.</div>
      <button class="btn btn-ghost btn-sm" id="resend-btn">Resend</button>
    </div>
    <div id="err-box" class="notice warn hidden"></div>
  </div>
</div>

<footer>© 2026 FunLearn Island</footer>

<script src="assets/app.js"></script>
<script>
initNav("login");
(async () => {
  const { session } = await getMembership();
  const pending = localStorage.getItem("pending_plan");
  if (session) {
    location.href = pending ? "account.html?subscribe=" + pending : "account.html";
    return;
  }
  const emailEl = document.getElementById("email");
  const send = async () => {
    const email = emailEl.value.trim();
    const errBox = document.getElementById("err-box");
    errBox.classList.add("hidden");
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
      errBox.textContent = "Please enter a valid email address.";
      errBox.classList.remove("hidden");
      return;
    }
    const btn = document.getElementById("send-btn");
    btn.disabled = true; btn.textContent = "Sending…";
    const { error } = await sb.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: SITE + "/account.html" },
    });
    btn.disabled = false; btn.textContent = "Send sign-in link";
    if (error) {
      errBox.textContent = "Couldn't send. Please try again later.";
      errBox.classList.remove("hidden");
      return;
    }
    document.getElementById("form-box").classList.add("hidden");
    document.getElementById("sent-email").textContent = email;
    document.getElementById("sent-box").classList.remove("hidden");
  };
  document.getElementById("send-btn").addEventListener("click", send);
  document.getElementById("resend-btn").addEventListener("click", () => {
    document.getElementById("sent-box").classList.add("hidden");
    document.getElementById("form-box").classList.remove("hidden");
  });
  emailEl.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
})();
</script>
</body>
</html>
