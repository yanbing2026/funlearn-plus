<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — FunLearn Island</title>
<link rel="stylesheet" href="assets/style.css">
<script src="assets/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<nav class="nav"><div class="nav-inner">
  <a class="logo" href="index.html">🏝️ FunLearn Island</a>
  <div class="nav-links">
    <a href="library.html" data-page="library" class="hide-sm">Library</a>
    <a href="index.html#pricing" class="hide-sm">Pricing</a>
    <span id="nav-auth"></span>
  </div>
</div></nav>

<div class="wrap" style="padding-bottom:64px">
  <div id="main"><p style="text-align:center;color:var(--muted);margin-top:60px">Loading…</p></div>
</div>

<footer>© 2026 FunLearn Island</footer>

<script src="assets/app.js"></script>
<script>
initNav("account");

const PLAN_NAMES = { monthly: "Monthly", yearly: "Annual" };
const STATUS_NAMES = {
  active: "Active", trialing: "Trialing", past_due: "Payment issue",
  canceled: "Canceled", inactive: "No subscription",
};

function fmtDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

(async () => {
  const main = document.getElementById("main");
  const params = new URLSearchParams(location.search);
  const { session, membership, active } = await getMembership();

  if (!session) { location.href = "login.html"; return; }

  // Returning from checkout: wait for the webhook to sync (poll ~12s)
  let justPaid = params.get("checkout") === "success";
  if (justPaid && !active) {
    for (let i = 0; i < 6; i++) {
      await new Promise(r => setTimeout(r, 2000));
      const s = await getMembership();
      if (s.active) { location.search = ""; return; }
    }
  }

  const email = session.user.email || "";
  const m = membership;
  const pill = active
    ? `<span class="status-pill on">👑 Active member</span>`
    : `<span class="status-pill off">No subscription</span>`;

  let actionHtml = "";
  if (active) {
    actionHtml = `
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:22px">
        <button class="btn btn-ghost btn-sm" onclick="openPortal(this)">Manage / cancel subscription</button>
        <a class="btn btn-teal btn-sm" href="library.html">Browse library →</a>
      </div>
      <p style="font-size:13px;color:var(--muted);margin-top:14px">To cancel, use subscription management — access continues until the end of the current period.</p>`;
  } else {
    const sub = params.get("subscribe") || localStorage.getItem("pending_plan");
    if (sub === "monthly" || sub === "yearly") {
      localStorage.removeItem("pending_plan");
      startCheckout(sub);
      main.innerHTML = `<div class="card form-card"><p>Redirecting you to secure checkout…</p></div>`;
      return;
    }
    actionHtml = `
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:22px">
        <button class="btn btn-sm" onclick="startCheckout('monthly', this)">Monthly $8/mo</button>
        <button class="btn btn-sm" onclick="startCheckout('yearly', this)">Annual $68/yr 👑</button>
      </div>`;
  }

  main.innerHTML = `
    <div class="card" style="max-width:640px;margin:48px auto">
      ${justPaid ? `<div class="notice">🎉 Payment successful! Welcome to FunLearn Island.</div>` : ""}
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:8px">
        <div style="font-size:40px">👤</div>
        <div><b>${escapeHtml(email)}</b><br>${pill}</div>
      </div>
      <div class="kv"><span>Current plan</span><b>${m && m.plan_id ? (PLAN_NAMES[m.plan_id] || m.plan_id) : "—"}</b></div>
      <div class="kv"><span>Status</span><b>${STATUS_NAMES[m?.status] || "No subscription"}</b></div>
      <div class="kv"><span>Current period ends</span><b>${fmtDate(m?.current_period_end)}</b></div>
      <div class="kv"><span>Auto-renew</span><b>${m?.cancel_at_period_end ? "No (ends after current period)" : (active ? "Yes" : "—")}</b></div>
      ${actionHtml}
      <div style="margin-top:26px;border-top:1px dashed var(--line);padding-top:16px">
        <a href="#" id="logout" style="color:var(--muted);font-size:14px">Sign out</a>
      </div>
    </div>`;

  document.getElementById("logout").addEventListener("click", async (e) => {
    e.preventDefault();
    await sb.auth.signOut();
    location.href = "index.html";
  });
})();
</script>
</body>
</html>
